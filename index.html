<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>I love you &lt;3</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  #canvas { display: block; width: 100vw; height: 100vh; }
  #bg-music {
    position: fixed; inset: 0; width: 100%; height: 100%;
    opacity: 0.01; z-index: 20; cursor: pointer;
  }
  #start-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 10; pointer-events: none; transition: opacity 0.6s ease;
  }
  #start-overlay.hidden { opacity: 0; }
  .heart-icon { font-size: 80px; color: #4682b4; animation: pulse 1.5s ease-in-out infinite; filter: drop-shadow(0 0 20px rgba(70,130,180,0.6)); }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
  .start-text { color: #94a3b8; font-size: 16px; margin-top: 24px; letter-spacing: 2px; text-transform: uppercase; }
  .click-hint { color: #4682b4; font-size: 14px; margin-top: 8px; animation: blink 2s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:.4} 50%{opacity:1} }
  .signature { position: fixed; bottom: 16px; right: 20px; color: rgba(150,170,200,0.45); font-family: Georgia, serif; font-size: 13px; font-style: italic; letter-spacing: 1px; z-index: 5; pointer-events: none; user-select: none; text-shadow: 0 0 12px rgba(70,130,180,0.4); }
  .signature::before { content: "♥ "; color: rgba(70,130,180,0.7); font-style: normal; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
</head>
<body>
<canvas id="canvas"></canvas>
<audio id="bg-music" src="./love_you.mp3" preload="auto" playsinline webkit-playsinline></audio>
<div class="signature">by iulik</div>
<div id="start-overlay">
  <div class="heart-icon">♥</div>
  <div class="start-text">Love You</div>
  <div class="click-hint">Нажми, чтобы начать</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('start-overlay');
const audioEl = document.getElementById('bg-music');

const WORDS = ["love you", "Love You", "LOVE YOU"];
const COLORS = [[70,130,180],[30,144,255],[0,191,255],[100,149,237],[65,105,225]];
const CENTER_TEXT = " Love You ";

let W, H, SCALE, particles = [], frame = 0, fillStartFrame = 0, running = false;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  SCALE = Math.min(W, H) / 60;
  if (running) rebuild();
}
function heartXY(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
  return [x, -y];
}
function toScreen(x, y) { return [x*SCALE + W/2, y*SCALE + H/2]; }
function makeParticle(x, y, order, kind) {
  return {
    x, y, order, kind,
    word: WORDS[Math.floor(Math.random()*WORDS.length)],
    color: COLORS[Math.floor(Math.random()*COLORS.length)],
    alpha: 0, flicker: Math.random()*Math.PI*2,
    sizeMult: 0.85 + Math.random()*0.3, delay: 0
  };
}
function buildOutline(n, minGap) {
  const arr = [], placed = [];
  for (let i = 0; i < n; i++) {
    const t = (i/n)*2*Math.PI;
    const [bx,by] = heartXY(t);
    const [sx,sy] = toScreen(bx,by);
    let close = false;
    for (const [px,py] of placed) if (Math.hypot(sx-px,sy-py) < minGap) { close = true; break; }
    if (close) continue;
    placed.push([sx,sy]);
    arr.push(makeParticle(sx,sy,i,'outline'));
  }
  return arr;
}
function buildFill(n, minGap) {
  const arr = [], placed = [];
  let att = 0, max = n*80;
  while (arr.length < n && att < max) {
    att++;
    const t = Math.random()*2*Math.PI, r = Math.random()*0.86;
    const [bx,by] = heartXY(t);
    const [sx,sy] = toScreen(bx*r, by*r);
    let close = false;
    for (const [px,py] of placed) if (Math.hypot(sx-px,sy-py) < minGap) { close = true; break; }
    if (close) continue;
    placed.push([sx,sy]);
    arr.push(makeParticle(sx,sy,Math.floor(Math.random()*320),'fill'));
  }
  return arr;
}
function rebuild() {
  const gOutline = Math.max(15, SCALE*1.2);
  const gFill = Math.max(22, SCALE*1.8);
  const outline = buildOutline(160, gOutline);
  const fill = buildFill(130, gFill);
  const span = outline.length ? Math.max(...outline.map(p=>p.order)) : 0;
  const fps = 1.6;
  fillStartFrame = Math.floor(span*fps) + 30;
  for (const p of outline) p.delay = Math.floor(p.order*fps);
  for (const p of fill) p.delay = fillStartFrame + p.order;
  particles = outline.concat(fill);
  frame = 0;
}
function drawParticle(p) {
  if (frame <= p.delay || p.alpha <= 0) return;
  const flick = p.alpha >= 255 ? 0.75 + 0.25*Math.sin(frame*0.04 + p.flicker) : 1.0;
  const a = Math.floor(p.alpha * flick);
  if (a <= 0) return;
  const size = (p.kind === 'outline' ? 18 : 15) * p.sizeMult;
  ctx.font = `bold ${size}px Arial, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (a > 10) {
    ctx.save();
    ctx.shadowColor = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${a/255})`;
    ctx.shadowBlur = 15 * p.sizeMult;
    ctx.fillStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${a/255})`;
    ctx.fillText(p.word, p.x, p.y);
    ctx.restore();
  }
}
function drawCenter() {
  const start = fillStartFrame + 200;
  if (frame <= start) return;
  const progress = Math.min(1, (frame-start)/60);
  const a = 1 - Math.exp(-progress*8);
  const pulse = 1 + 0.025*Math.sin(frame*0.05);
  const size = Math.min(W,H)/15 * pulse;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold ${size}px Georgia, serif`;
  ctx.shadowColor = `rgba(255,20,147,${a/4})`;
  ctx.shadowBlur = 30;
  ctx.fillStyle = `rgba(255,105,180,${a})`;
  ctx.fillText(CENTER_TEXT, W/2, H/2);
  ctx.fillText(CENTER_TEXT, W/2, H/2);
  ctx.restore();
}
function animate() {
  if (!running) return;
  requestAnimationFrame(animate);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  frame++;
  for (const p of particles) {
    if (frame > p.delay && p.alpha < 255)
      p.alpha = Math.min(255, p.alpha + 14 + Math.floor(Math.random()*5));
    drawParticle(p);
  }
  drawCenter();
}

let started = false;
function startAll() {
  if (started) return;
  started = true;

  // Музыка через Howler.js
  window.loveSound = new Howl({
    src: ["./love_you.mp3"],
    volume: 0.8,
    html5: true,
    onloaderror: (id, err) => console.log("load err:", err),
    onplayerror: (id, err) => {
      window.loveSound.once("unlock", () => window.loveSound.play());
    }
  });
  window.loveSound.play();
  overlay.classList.add('hidden');

  // Анимация
  running = true;
  rebuild();
  animate();
}

// Аудио-элемент на весь экран — тап по нему = тап по экрану
// Дублируем на документ
document.addEventListener('click', startAll);
document.addEventListener('touchstart', startAll, { passive: true });
window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
